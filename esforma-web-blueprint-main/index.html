<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- ✅ Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- ✅ Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuente sin bloquear el render (solo los pesos que se usan) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- Imagen inicial del hero: se pide antes que todo lo demás -->
    <link rel="preload" as="image" href="/hero-poster.webp" type="image/webp" fetchpriority="high" />

    <!-- Splash instantáneo (antes de que cargue JS) -->
    <style>
      #boot-splash{position:fixed;inset:0;z-index:10000;background:#000;display:flex;align-items:center;justify-content:center}
      #boot-splash svg{width:112px;height:112px;animation:boot-spin 1.1s linear infinite}
      @media (min-width:768px){#boot-splash svg{width:144px;height:144px}}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){#boot-splash svg{animation:none}}
    </style>

    <!-- ✅ Meta etiquetas reales -->
    <title>Esformaseg - Formación en Seguridad Privada</title>
    <meta
      name="description"
      content="Esformaseg es un centro de formación autorizado por el Ministerio del Interior para capacitar personal en vigilancia, seguridad privada, porte de armas y especializaciones."
    />
    <meta name="author" content="Esformaseg" />
    <meta name="keywords" content="Esformaseg, seguridad privada, cursos, portación de armas, vigilancia, capacitación, Quito, Ecuador" />

    <!-- ✅ Open Graph (para compartir en redes) -->
    <meta property="og:title" content="Esformaseg - Formación en Seguridad Privada" />
    <meta
      property="og:description"
      content="Centro de formación de seguridad privada con cursos avalados. Capacitación en Quito, Santo Domingo y Orellana."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://esformaseg.com/esformaseg-logo.png" />
    <meta property="og:url" content="https://esformaseg.com" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Esformaseg - Formación en Seguridad Privada" />
    <meta
      name="twitter:description"
      content="Cursos en seguridad, vigilancia, armas y especialización. Avalado por el Ministerio del Interior."
    />
    <meta name="twitter:image" content="https://esformaseg.com/esformaseg-logo.png" />
  </head>

  <body>
    <div id="boot-splash" aria-hidden="true">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/><circle cx="50" cy="50" r="47" fill="none" stroke="hsl(0,85%,50%)" stroke-width="2" stroke-linecap="round" stroke-dasharray="60 300"/></svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
